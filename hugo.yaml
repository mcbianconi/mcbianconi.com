# https://github.com/frjo/hugo-theme-zen?tab=readme-ov-file#configuration
---
title: "My site"
baseURL: "https://mcbianconi.com/"
theme: "zen"
# https://gohugo.io/methods/page/gitinfo/
enableGitInfo: true
languageCode: "en"

defaultContentLanguage: "en"
defaultContentLanguageInSubdir: false
disableDefaultLanguageRedirect: false

pluralizelisttitles: true
removePathAccents: true
sectionPagesMenu: main

outputFormats:
  SearchIndex:
    mediaType: "application/json"
    baseName: "searchindex"
    isPlainText: true
    notAlternative: true

outputs:
  home: ["HTML", "RSS", "SearchIndex"]
  section: ["HTML", "RSS"]

params:
  contact: "contato@mcbianconi.com"
  description: "Murillo's personal site."
  dateformat: "2 January, 2006"
  favicon: "apple-touch-icon.png"
  feedlinks: true
  icon: "apple-touch-icon.png"
  image: "apple-touch-icon.png"
  imageMaxWidth: 400
  logoWidth: 64
  mobileMenu: true
  poweredby: false
  sidebar: true
  submitted: true
  author:
    name: "Murillo"
    url: "https://mcbianconi.com/murillo"
    avatar: "path/to/some-image.jpg"
  relatedPosts: true
  alpine: false
  cookieConsent: true

languages:
  en:
    title: "My site"
    languageName: "English"
    weight: 1

  pt:
    title: "Meu site"
    languageName: "Português"
    weight: 2

taxonomies:
  tecnica: tecnicas
  technique: techniques

caches:
  images:
    dir: :cacheDir/images
